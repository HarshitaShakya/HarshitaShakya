name: Generate Neural Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/neural_graph.py"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build SVG
        env:
          GH_USER: HarshitaShakya
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/neural_graph.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add neural-graph.svg
          git diff --staged --quiet || git commit -m "chore: update neural graph"
          git push
          
