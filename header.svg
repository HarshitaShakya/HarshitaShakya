<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@800;900&amp;display=swap');
            
            .name {
                font-family: 'Outfit', system-ui, -apple-system, sans-serif;
                font-size: 84px;
                font-weight: 900;
                fill: url(#textGrad);
                letter-spacing: -2px;
                text-anchor: middle;
                dominant-baseline: middle;
                /* Subtle shadow so text is always readable over the moving flower */
                filter: drop-shadow(0px 4px 12px rgba(0,0,0,0.9));
            }
            .subtitle {
                font-family: 'Outfit', system-ui, -apple-system, sans-serif;
                font-size: 20px;
                font-weight: 800;
                fill: #00A3FF;
                text-anchor: middle;
                dominant-baseline: middle;
                letter-spacing: 1px;
                filter: drop-shadow(0px 2px 6px rgba(0,0,0,0.9));
            }
            .flower {
                fill: url(#blobGrad);
                filter: url(#glowBlur);
                transform-origin: 0px 0px;
                /* Slowed down to 35 seconds for a very relaxing, smooth glide */
                animation: floatAround 35s ease-in-out infinite alternate;
            }
            /* Smoothly float all over the 800x300 area */
            @keyframes floatAround {
                0% { transform: translate(150px, 150px) rotate(0deg) scale(0.9); opacity: 0.6; }
                25% { transform: translate(650px, 80px) rotate(90deg) scale(1.1); opacity: 0.85; }
                50% { transform: translate(400px, 220px) rotate(180deg) scale(0.95); opacity: 0.55; }
                75% { transform: translate(150px, 250px) rotate(270deg) scale(1.15); opacity: 0.9; }
                100% { transform: translate(600px, 150px) rotate(360deg) scale(1.0); opacity: 0.7; }
            }
        </style>

        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00A3FF" />
            <stop offset="100%" stop-color="#00E1FF" />
        </linearGradient>

        <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0055FF" />
            <stop offset="100%" stop-color="#00E1FF" />
        </linearGradient>

        <!-- Reduced blur to 18 so the perfect geometric flower petals are highly visible -->
        <filter id="glowBlur" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="18" />
        </filter>
    </defs>
    
    <rect width="100%" height="100%" fill="#060A14" rx="16" ry="16"/>

    <!-- Perfect Geometric 8-Petal Flower Shade -->
    <g class="flower">
        <!-- 4 intersecting ellipses to create 8 beautiful petals -->
        <ellipse cx="0" cy="0" rx="35" ry="110" transform="rotate(0)" />
        <ellipse cx="0" cy="0" rx="35" ry="110" transform="rotate(45)" />
        <ellipse cx="0" cy="0" rx="35" ry="110" transform="rotate(90)" />
        <ellipse cx="0" cy="0" rx="35" ry="110" transform="rotate(135)" />
        <!-- Center core to make it feel full and connected -->
        <circle cx="0" cy="0" r="45" />
    </g>

    <text x="400" y="130" class="name">Harshita Shakya</text>
    <text x="400" y="210" class="subtitle">AI &amp; ML Engineer | Agentic AI | Deep Learning</text>
</svg>
